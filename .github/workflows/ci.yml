name: CI - StudioKassandraHair MVP

on:
  push:
    branches: [ "principal", "main" ]
  pull_request:
    branches: [ "principal", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias e pytest-cov
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx pytest pytest-cov

      - name: Executar testes unitarios e de integracao
        env:
          PYTHONPATH: .
        run: pytest -v --cov=backend --cov-report=term-missing
